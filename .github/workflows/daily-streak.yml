name: Daily Activity Log Update

on:
  schedule:
    # Runs at 12:00 PM (Noon) PHT / GMT+8 (which is 04:00 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  update-log:
    runs-on: ubuntu-latest
    # Required to allow the GitHub Action to push code back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update and commit multiple times randomly
        run: |
          git config --global user.name "Japx09"
          git config --global user.email "Japx09@users.noreply.github.com"
          NUM_COMMITS=$((1 + RANDOM % 12))
          echo "Generating $NUM_COMMITS commit(s) for today..."
          for ((i=1; i<=NUM_COMMITS; i++)); do
            echo "$(date) - update $i of $NUM_COMMITS" >> daily-streak.txt
            git add daily-streak.txt
            git commit -m "chore: automated daily log update $i"
          done
          git push
