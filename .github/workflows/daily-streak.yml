name: Daily Activity Log Update

on:
  schedule:
    # Runs at 12:00 PM (Noon) PHT / GMT+8 (which is 04:00 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  update-log:
    runs-on: ubuntu-latest
    # Required to allow the GitHub Action to push code back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily-streak.txt
        run: |
          echo "$(date)" >> daily-streak.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-streak.txt
          git commit -m "chore: automated daily log update" || exit 0
          git push
